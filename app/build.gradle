plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.google.services)
    alias(libs.plugins.firebase.crashlytics)
    id "com.google.android.gms.oss-licenses-plugin"
}

apply from: 'google-services-dummy.gradle'

def secretsPropertiesFile = rootProject.file("secrets.properties")
def secretsProperties = new Properties()
def signingEnabled = false

android {
    namespace project.ext.appNameSpace
    compileSdk {
        version = 36
    }

    defaultConfig {
        applicationId project.ext.applicationId
        minSdk 26
        targetSdk 34

        //version since codebase modernisation
        versionCode 1
        versionName "0.0.1"

        // Flag to enable support for the new language APIs
        multiDexEnabled true

        // Use Java 17 source/target; Kotlin code has been converted to Java
        targetCompatibility JavaVersion.VERSION_17
        sourceCompatibility JavaVersion.VERSION_17
        // Enable desugar for Java 8 language features
        desugarEnabled true
    }

    if (secretsPropertiesFile.exists() && secretsPropertiesFile.text.trim()) {
        signingEnabled = true
        secretsProperties.load(new FileInputStream(secretsPropertiesFile))
    } else if (System.getenv("KEYSTORE_PASSWORD") != null) {
        signingEnabled = true
    }

    signingConfigs {
        global {
            storeFile file("codeopsstudio.keystore")
            keyAlias System.getenv("KEY_ALIAS") ?: secretsProperties['KEY_ALIAS']
            keyPassword System.getenv("KEY_PASSWORD") ?: secretsProperties['KEY_PASSWORD']
            storePassword System.getenv("KEYSTORE_PASSWORD") ?: secretsProperties['STORE_PASSWORD']
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (signingEnabled) {
                signingConfig signingConfigs.global
            }
        }
        debug {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (signingEnabled) {
                signingConfig signingConfigs.global
            }
        }
    }

    // Build tools version - using 34.0.0 to minimize unnecessary updates
    buildToolsVersion "34.0.0"

    // NDK configuration - specifying version 29 only to avoid multiple downloads
    externalNativeBuild {
        ndk {
            version "29"
        }
    }

    // Configure only essential SDK components to minimize downloads
    // This ensures only required tools are installed
    ndk {
        // Only NDK 29 will be available
        abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
    }
}

dependencies {
    // AndroidX essential libraries (Java compatible - core-ktx removed)
    implementation(libs.androidx.appcompat)
    implementation(libs.androidx.preference)
    implementation(libs.androidx.swiperefreshlayout)
    implementation(libs.androidx.work.runtime)
    implementation(libs.androidx.data.store)
    implementation(libs.androidx.navigation.ui)
    implementation(libs.androidx.constraintlayout)
    implementation(libs.androidx.navigation.fragment)
    
    // Essential native and support libraries
    implementation(libs.other.org.eclipse.lsp4j)
    implementation(libs.other.commonmark)
    implementation(google.material)
    implementation(libs.google.play.services.oss.licenses)
    
    // Firebase - only essential components (no Kotlin-only features)
    implementation(platform(libs.firebase.bom))
    implementation(libs.firebase.analytics)
    implementation(libs.firebase.messaging)
    implementation(libs.firebase.crashlytics)
    implementation(libs.firebase.inappmessaging)

    testImplementation libs.other.junit
    androidTestImplementation libs.other.ext.junit
    androidTestImplementation libs.other.espresso.core
    // leakcanary and sora-editor are Kotlin-based, excluded for Java-only setup
    coreLibraryDesugaring(libs.other.desugar)

    implementation project(path: ":common")
    implementation project(path: ":server")
    implementation project(path: ":pane")
    implementation project(path: ":shared-res")
    implementation project(path: ":code-editor")
    implementation project(path: ":modules:treeview")
    implementation project(path: ":modules:plugin:runtime")
    implementation project(path: ":modules:ast-core")
    implementation project(path: ":modules:share-layout")
    implementation project(path: ":modules:plugin-api:common")
    implementation project(path: ":modules:plugin-api:intellisense")
}

// Print version task
tasks.register('printVersion') {
    doLast {
        println "VERSION_NAME=${project.ext.appVersionName}"
        println "VERSION_CODE=${project.ext.appVersionCode}"
    }
}

// Kotlin configuration - disabled/minimal since all code is Java
// JVM target set to 17 for Java compatibility
kotlin {
    compilerOptions {
        // Kotlin compiler configured for Java 17 target
        // All Kotlin code has been converted to Java
        jvmTarget = "17"
    }
}